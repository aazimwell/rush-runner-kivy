name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Rush Runner APK (Buildozer)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf autoconf-archive automake m4 gettext libtool libtool-bin \
            pkg-config zlib1g-dev libncurses-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Fix libtool aclocal macros for libffi
        run: |
          # p4a's libffi recipe runs autogen.sh/autoreconf, which failed
          # with "possibly undefined macro: LT_SYS_SYMBOL_USCORE" because
          # libtool's m4 macros were not on aclocal's search path.
          sudo cp /usr/share/libtool/m4/*.m4 /usr/share/aclocal/ 2>/dev/null || true
          sudo cp /usr/share/aclocal/*.m4 /usr/local/share/aclocal/ 2>/dev/null || true
          ls /usr/share/aclocal/ | grep -i libtool || true

      - name: Install Buildozer and pinned Cython
        run: |
          python3 -m pip install --upgrade pip
          # Cython < 3 is required by current python-for-android practice
          pip install "Cython<3.0" buildozer
          # NOTE: do NOT upgrade python-for-android here. Run #6 showed
          # that the upgraded p4a breaks at "pip install -U pip" inside
          # its build venv (BuildDependencyInstallError removed from
          # newer pip), while the Buildozer-bundled p4a got past that
          # step in earlier runs.

      - name: Build APK (debug)
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/local/share/aclocal
          # p4a's build venv runs "pip install -U pip", which upgrades to
          # pip 25+/26 where BuildDependencyInstallError was removed from
          # pip._internal.exceptions, breaking old p4a code. Pinning pip
          # below 25 in that venv (via a constraints file) keeps the
          # import working.
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          # Buildozer's first run downloads the Android SDK and prompts
          # to accept its licences; on a non-interactive runner the
          # default answer is No, which previously failed the build.
          # Piping "yes" accepts those licences.
          yes | buildozer android debug
          ls -lh bin/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUSH-RUNNER-ANDROID-APK
          path: bin/*.apk
          if-no-files-found: error
